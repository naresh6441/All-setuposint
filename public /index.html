
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECURE API CONSOLE - OSINT DASHBOARD</title>

<style>
:root {
  --bg-main: #05080e;
  --bg-card: #0d1420;
  --bg-inner: #080d16;
  --accent-green: #18a957;
  --accent-green-bright: #28d978;
  --accent-orange: #ff9d24;
  --text-main: #e6ebf3;
  --text-muted: #8b95a7;
  --border-color: #1c2535;
  --border-input: #222d40;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-main);
  background: linear-gradient(180deg, #05080e 0%, #0a0f19 55%, #05080e 100%);
}

.topbar {
  background: #04070d;
  border-top: 5px solid var(--accent-green);
  border-bottom: 2px solid var(--accent-orange);
  padding: 12px 18px;
}

.brandline {
  max-width: 980px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 12px;
}

.brandline .shield { color: var(--accent-green-bright); }
.brandline .brand { color: var(--accent-orange); }

.page {
  width: min(980px, calc(100% - 24px));
  margin: 30px auto 60px;
}

.hero {
  background: linear-gradient(135deg, #0a1226, #13264a);
  border-radius: 20px 20px 0 0;
  border-bottom: 3px solid var(--accent-orange);
  padding: 24px;
  text-align: center;
}

.panel {
  background: var(--bg-card);
  padding: 24px;
  border-radius: 0 0 20px 20px;
  border: 1px solid var(--border-color);
  border-top: 0;
}

.services {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  background: var(--bg-inner);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 8px;
}

.service {
  border: 0;
  border-radius: 10px;
  background: transparent;
  padding: 12px;
  cursor: pointer;
  color: var(--text-muted);
  font-weight: 800;
  font-size: 11px;
}

.service.active {
  background: #16233f;
  color: #fff;
}

.form-title { margin: 20px 0 10px; font-size: 13px; font-weight: 800; }

.input-wrap {
  display: flex;
  min-height: 50px;
  border: 1px solid var(--border-input);
  border-radius: 12px;
  background: var(--bg-inner);
}

.prefix {
  width: 70px;
  display: grid;
  place-items: center;
  border-right: 1px solid var(--border-input);
  color: var(--text-muted);
  font-weight: 800;
}

.input-wrap input {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 0 16px;
  color: #fff;
  outline: none;
}

.hint { margin: 10px 0; color: var(--text-muted); font-size: 12px; }

.search {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  color: white;
  background: linear-gradient(135deg, var(--accent-orange), #f18c00);
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

.live-console {
  margin-top: 20px;
  border: 1px solid var(--border-color);
  border-radius: 14px;
  background: #05080e;
}

.console-head {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  background: #0b1424;
  border-bottom: 1px solid var(--border-color);
  font-size: 11px;
}

.console-body {
  height: 180px;
  overflow-y: auto;
  padding: 8px;
  font: 11px Consolas, monospace;
}

.console-line { padding: 3px 0; display: flex; gap: 8px; }
.console-line.INFO { color: #65c9ff; }
.console-line.SUCCESS { color: #55e99a; }
.console-line.ERROR { color: #ff6877; }

pre {
  margin-top: 15px;
  padding: 14px;
  background: #05080e;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  font: 11px Consolas, monospace;
  color: #d8e4f4;
  white-space: pre-wrap;
}

.login-overlay {
  position: fixed; inset: 0; z-index: 99;
  display: flex; align-items: center; justify-content: center;
  background: rgba(3, 10, 22, 0.95);
}

.login-card {
  width: 320px; padding: 24px;
  border: 1px solid var(--border-color);
  border-radius: 16px; background: #0b1930;
}

.login-card input {
  width: 100%; padding: 10px; margin: 8px 0 12px;
  border: 1px solid var(--border-input);
  border-radius: 8px; background: #071225; color: #fff;
}

.login-card button {
  width: 100%; padding: 10px; border: 0;
  border-radius: 8px; background: var(--accent-green);
  color: #fff; font-weight: 800; cursor: pointer;
}
</style>
</head>

<body>

<div class="login-overlay" id="loginOverlay">
  <form class="login-card" id="loginForm">
    <h3 style="color:#fff; margin-bottom:12px;">🔐 Secure Login</h3>
    <input id="loginUsername" placeholder="Username" required>
    <input id="loginPassword" type="password" placeholder="Password" required>
    <button type="submit">LOGIN</button>
  </form>
</div>

<header class="topbar">
  <div class="brandline">
    <span class="shield">◆</span>
    <span class="brand">NARESH OSINT</span> | SECURE API CONSOLE
  </div>
</header>

<main class="page">
  <section class="hero">
    <h1>API CONSOLE</h1>
  </section>

  <section class="panel">
    <div class="services">
      <button class="service active" data-service="phone">Phone</button>
      <button class="service" data-service="ifsc">IFSC</button>
      <button class="service" data-service="vehicle">Vehicle</button>
      <button class="service" data-service="aadhar">Aadhaar</button>
    </div>

    <div class="form-title" id="inputTitle">● ENTER PHONE NUMBER</div>

    <div class="input-wrap">
      <div class="prefix" id="prefix">+91</div>
      <input id="queryInput" placeholder="Enter 10-digit phone number">
    </div>

    <div class="hint" id="hint">Ready to search</div>
    <button class="search" id="searchBtn">SEARCH</button>

    <div class="live-console">
      <div class="console-head">
        <span>📡 LIVE CONSOLE</span>
        <span id="consoleStatus" style="color:#28d978;">READY</span>
      </div>
      <div class="console-body" id="consoleBody"></div>
    </div>

    <pre id="jsonResponse">{ "status": "ready" }</pre>
  </section>
</main>

<script>
const API_CONFIG = {
  phone: { label: "PHONE NUMBER", prefix: "+91", url: "/api/phone?query={query}" },
  ifsc: { label: "IFSC CODE", prefix: "IFSC", url: "/api/ifsc?query={query}" },
  vehicle: { label: "VEHICLE NUMBER", prefix: "RC", url: "/api/vehicle?query={query}" },
  aadhar: { label: "AADHAAR NUMBER", prefix: "ID", url: "/api/aadhar?query={query}" }
};

document.getElementById("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (document.getElementById("loginUsername").value === "admin" && 
      document.getElementById("loginPassword").value === "admin123") {
    document.getElementById("loginOverlay").style.display = "none";
  }
});

let currentService = "phone";
const buttons = document.querySelectorAll(".service");
const input = document.getElementById("queryInput");
const consoleBody = document.getElementById("consoleBody");

function log(type, msg) {
  const div = document.createElement("div");
  div.className = "console-line " + type;
  div.textContent = `[${new Date().toLocaleTimeString()}] ${type}: ${msg}`;
  consoleBody.appendChild(div);
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentService = btn.dataset.service;
    const cfg = API_CONFIG[currentService];
    document.getElementById("inputTitle").textContent = "● ENTER " + cfg.label;
    document.getElementById("prefix").textContent = cfg.prefix;
    log("INFO", "Switched to " + cfg.label);
  });
});

document.getElementById("searchBtn").addEventListener("click", async () => {
  const val = input.value.trim();
  if (!val) return log("ERROR", "Input is empty");

  const endpoint = API_CONFIG[currentService].url.replace("{query}", encodeURIComponent(val));
  log("INFO", "Requesting: " + endpoint);

  try {
    const res = await fetch(endpoint);
    const data = await res.json();
    document.getElementById("jsonResponse").textContent = JSON.stringify(data, null, 2);
    log("SUCCESS", "Data received successfully");
  } catch (err) {
    log("ERROR", "Fetch error: " + err.message);
  }
});
</script>
</body>
</html>
